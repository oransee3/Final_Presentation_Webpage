<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학습내용 쇼케이스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-space: #030712;
      --card-bg: rgba(13, 22, 38, 0.75);
      --card-border: rgba(45, 212, 191, 0.2);
      --neon-cyan: #22d3ee;
      --neon-emerald: #10b981;
      --neon-glow: rgba(34, 211, 238, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-space);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 24px;
      position: relative;
    }

    .space-grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(20, 60, 85, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(20, 60, 85, 0.22) 1px, transparent 1px);
      background-size: 58px 58px;
      pointer-events: none;
      z-index: 0;
    }

    #particlesCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 1800px;
      height: 100%;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 1행 헤더 네비게이션 */
    header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 10px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .nav-tab-btn {
      padding: 9px 20px;
      font-size: 0.92rem;
      font-weight: 800;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.6);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      backdrop-filter: blur(8px);
    }

    .nav-tab-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #f8fafc;
      border-color: rgba(34, 211, 238, 0.4);
      transform: translateY(-1px);
    }

    .nav-tab-btn.active {
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.8) 0%, rgba(13, 148, 136, 0.8) 100%);
      color: #ffffff;
      border-color: #22d3ee;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
    }

    .nav-tab-btn.active .tab-icon-tag {
      background: #22d3ee;
      color: #042f2e;
    }

    .tab-icon-tag {
      font-size: 0.76rem;
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    /* 2행 메인 쇼케이스 영역[cite: 2] */
    .showcase-layout {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .viewer-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 6px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      display: flex;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .visual-window {
      background: rgba(3, 7, 18, 0.9);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    /* 95% 비율 피팅 iframe 스타일 */
    .content-frame {
      width: 95%;
      height: 95%;
      border: none;
      border-radius: 10px;
      background: #0d1017;
      display: block;
    }

  </style>
</head>
<body>

  <div class="space-grid-bg"></div>
  <canvas id="particlesCanvas"></canvas>

  <div class="container">
    <!-- 1행 상단 버튼 4종[cite: 2] -->
    <header>
      <nav class="nav-tabs">
        <button class="nav-tab-btn active" onclick="switchCategory('MUSIC_WORKFLOW', this)">
          <span class="tab-icon-tag">🎵 WF</span> AI Music Studio 워크플로우 설계
        </button>
        <button class="nav-tab-btn" onclick="switchCategory('MUSIC_ARCH', this)">
          <span class="tab-icon-tag">🏛️ ARCH</span> AI Music Studio 아키텍처
        </button>
        <button class="nav-tab-btn" onclick="switchCategory('THUMB_WORKFLOW', this)">
          <span class="tab-icon-tag">🎨 WF</span> 썸네일 디자이너 워크플로우 설계
        </button>
        <button class="nav-tab-btn" onclick="switchCategory('THUMB_ARCH', this)">
          <span class="tab-icon-tag">📐 ARCH</span> 썸네일 디자이너 아키텍처
        </button>
      </nav>
    </header>

    <!-- 2행 결과물 뷰어: 고정 iframe 구조로 깜빡임 및 로드 누락 방지[cite: 2] -->
    <main class="showcase-layout">
      <section class="viewer-card" style="position: relative;">
        <div class="visual-window" id="visualWindow">
          <iframe id="mainViewerFrame" class="content-frame" src="./1-AI%20Music%20Video%20Workflow.html" title="AI Music Studio 워크플로우 설계"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    /* 캔버스 배경 파티클 엔진[cite: 2] */
    const canvas = document.getElementById('particlesCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const colors = ['#22d3ee', '#38bdf8', '#34d399', '#10b981', '#6ee7b7'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.x = Math.random() * canvas.width;
        this.y = init ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 2.2 + 1.2;
        this.speedY = -(Math.random() * 0.45 + 0.15);
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = Math.random() * 0.6 + 0.3;
        this.pulseSpeed = Math.random() * 0.02 + 0.01;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += Math.sin(Date.now() * 0.002 * this.pulseSpeed) * 0.015;
        if (this.alpha < 0.2) this.alpha = 0.2;
        if (this.alpha > 0.95) this.alpha = 0.95;
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.radius * 5.5;
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 48; i++) { particles.push(new Particle()); }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* 4개 버튼 동일 폴더 파일 매핑[cite: 4, 5, 6, 8] */
    const categoryData = {
      MUSIC_WORKFLOW: {
        title: "AI Music Studio 워크플로우 설계",
        fileName: "1-AI Music Video Workflow.html"
      },
      MUSIC_ARCH: {
        title: "AI Music Studio 아키텍처",
        fileName: "1-AI Music Studio Architecture.html"
      },
      THUMB_WORKFLOW: {
        title: "썸네일 디자이너 워크플로우 설계",
        fileName: "2-Thumbnail Designer Workflow.html"
      },
      THUMB_ARCH: {
        title: "썸네일 디자이너 아키텍처",
        fileName: "2-thumbnail_architecture.html"
      }
    };

    function switchCategory(category, btnElement) {
      const buttons = document.querySelectorAll('.nav-tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const data = categoryData[category];
      if (!data) return;

      const iframe = document.getElementById('mainViewerFrame');
      iframe.title = data.title;
      // 상대경로와 공백 인코딩 처리
      iframe.src = './' + encodeURIComponent(data.fileName);
    }

    window.onload = function() {
      lucide.createIcons();
    };
  </script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
