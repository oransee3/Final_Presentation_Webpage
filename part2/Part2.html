<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Domus Music Studio - System Intro & Architecture</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #080a0f;
    color: #e2e8f0;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    user-select: none;
  }

  /* 1. 실시간 스타필드 + 그리드 배경 캔버스 */
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* 2. 메인 뷰포트 & 인트로 컨테이너 */
  .viewport {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* 상단 헤더 타이틀 */
  .intro-header {
    text-align: center;
    margin-bottom: 24px;
    z-index: 2;
  }
  .intro-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 10px;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
  }
  .intro-title {
    font-size: 28px;
    font-weight: 800;
    color: #f8fafc;
    letter-spacing: -0.5px;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
  }
  .intro-desc {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 6px;
  }

  /* 비디오 플레이어 랩퍼 (글래스모피즘 + 사이버네틱 글로우) */
  .video-stage-container {
    position: relative;
    width: 100%;
    max-width: 980px;
    aspect-ratio: 16 / 9;
    background: rgba(18, 22, 33, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid rgba(56, 189, 248, 0.3);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.15);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    z-index: 2;
  }
  .video-stage-container:hover {
    border-color: rgba(74, 222, 128, 0.6);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(74, 222, 128, 0.25);
  }

  video#intro-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  /* 커스텀 오버레이 좌측 뱃지 */
  .status-badge {
    position: absolute;
    top: 18px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(8, 10, 15, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    color: #e2e8f0;
    pointer-events: none;
    z-index: 3;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  /* 우측 상단 버튼 및 타이틀 배지 */
  .fullscreen-overlay-btn {
    position: absolute;
    top: 18px;
    right: 20px;
    background: rgba(8, 10, 15, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38bdf8;
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
    z-index: 3;
  }
  .fullscreen-overlay-btn:hover {
    background: #38bdf8;
    color: #04111d;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
  }

  /* 전체화면 진입 시 우측 상단 스타일 (발표 타이틀 모드) */
  .video-stage-container:fullscreen .fullscreen-overlay-btn,
  .video-stage-container:-webkit-full-screen .fullscreen-overlay-btn {
    background: rgba(8, 10, 15, 0.88);
    border: 1.5px solid rgba(74, 222, 128, 0.65);
    color: #4ade80;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.2px;
    padding: 9px 20px;
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.25);
    cursor: default;
    pointer-events: auto;
  }
  .video-stage-container:fullscreen .fullscreen-overlay-btn:hover,
  .video-stage-container:-webkit-full-screen .fullscreen-overlay-btn:hover {
    background: rgba(8, 10, 15, 0.95);
    color: #4ade80;
  }

  /* 전체화면 시 기본 브라우저 배율 대응 */
  .video-stage-container:fullscreen {
    max-width: 100vw;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border: none;
  }
  .video-stage-container:-webkit-full-screen {
    max-width: 100vw;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border: none;
  }

  /* 하단 단축키 가이드 HUD */
  .hud-dock {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(18, 22, 33, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 10px 20px;
    z-index: 2;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }
  .hud-item {
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hud-key {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 11px;
    color: #38bdf8;
    font-weight: 700;
  }
  .hud-btn-main {
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
    border: none;
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
    transition: all 0.2s ease;
    margin-left: 8px;
  }
  .hud-btn-main:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 22px rgba(14, 165, 233, 0.7);
  }
</style>
</head>
<body>

<!-- 실시간 스타필드 + 그리드 배경 캔버스 -->
<canvas id="bg-canvas"></canvas>

<div class="viewport">
  <!-- 상단 프리젠테이션 헤더 -->
  <header class="intro-header">
    <div class="intro-tag">✨ Next-Gen AI Pipeline Intro</div>
    <h1 class="intro-title">AI Domus Music Studio — Official Showcase</h1>
    <p class="intro-desc">단 몇 줄의 프롬프트로 음원, 썸네일, 9분할 영상 합성부터 YouTube 자동화까지</p>
  </header>

  <!-- 비디오 스테이지 -->
  <div class="video-stage-container" id="videoContainer">
    <!-- 상태 표시 좌측 뱃지 -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>4K / FHD Master WebM Showcase</span>
    </div>

    <!-- 우측 상단 버튼 (전체화면 시 프로젝트명으로 자동 변경) -->
    <button class="fullscreen-overlay-btn" id="fsButton" onclick="handleBtnClick()">
      <span id="btnIcon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </span>
      <span id="btnText">전체화면 (F)</span>
    </button>

    <!-- WebM 비디오 플레이어 -->
    <video id="intro-video" controls playsinline preload="auto">
      <source src="intro.webm" type="video/webm">
      사용자의 브라우저가 비디오 태그를 지원하지 않습니다.
    </video>
  </div>

  <!-- 하단 컨트롤 도크 -->
  <div class="hud-dock">
    <div class="hud-item"><span class="hud-key">Space</span> 재생 / 일시정지</div>
    <div class="hud-item" style="color: rgba(255,255,255,0.2);">|</div>
    <div class="hud-item"><span class="hud-key">F</span> 전체화면 토글</div>
    <div class="hud-item" style="color: rgba(255,255,255,0.2);">|</div>
    <div class="hud-item"><span class="hud-key">M</span> 음소거 토글</div>
    <button class="hud-btn-main" onclick="startIntroPresentation()">▶ 발표 모드로 시작 (전체화면 재생)</button>
  </div>
</div>

<script>
  /* ==========================================================
     1. 실시간 스타필드 & 사이버네틱 그리드 배경
     ========================================================== */
  const bgCanvas = document.getElementById('bg-canvas');
  const bgCtx = bgCanvas.getContext('2d');

  let width = (bgCanvas.width = window.innerWidth);
  let height = (bgCanvas.height = window.innerHeight);

  window.addEventListener('resize', () => {
    width = bgCanvas.width = window.innerWidth;
    height = bgCanvas.height = window.innerHeight;
  });

  const STAR_COUNT = 90;
  const stars = [];
  const starColors = ['#4ade80', '#22c55e', '#38bdf8', '#0ea5e9', '#60a5fa'];

  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() < 0.25 ? Math.random() * 1.6 + 1.2 : Math.random() * 0.9 + 0.6,
      color: starColors[Math.floor(Math.random() * starColors.length)],
      alpha: Math.random() * 0.7 + 0.3,
      alphaSpeed: (Math.random() * 0.015 + 0.005) * (Math.random() < 0.5 ? 1 : -1)
    });
  }

  function drawBackground() {
    bgCtx.clearRect(0, 0, width, height);

    const grad = bgCtx.createRadialGradient(width * 0.5, height * 0.5, 50, width * 0.5, height * 0.5, Math.max(width, height) * 0.85);
    grad.addColorStop(0, '#0a0e17');
    grad.addColorStop(1, '#05070a');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, width, height);

    const gridSize = 45;
    bgCtx.lineWidth = 1;
    bgCtx.strokeStyle = 'rgba(56, 189, 248, 0.045)';

    bgCtx.beginPath();
    for (let x = 0; x < width; x += gridSize) {
      bgCtx.moveTo(x, 0);
      bgCtx.lineTo(x, height);
    }
    for (let y = 0; y < height; y += gridSize) {
      bgCtx.moveTo(0, y);
      bgCtx.lineTo(width, y);
    }
    bgCtx.stroke();

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.alpha += s.alphaSpeed;
      if (s.alpha > 0.95 || s.alpha < 0.2) s.alphaSpeed = -s.alphaSpeed;

      bgCtx.save();
      bgCtx.globalAlpha = s.alpha;
      bgCtx.fillStyle = s.color;
      bgCtx.shadowBlur = s.radius > 1.2 ? 10 : 5;
      bgCtx.shadowColor = s.color;

      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      bgCtx.fill();
      bgCtx.restore();
    }
    requestAnimationFrame(drawBackground);
  }
  drawBackground();

  /* ==========================================================
     2. 비디오 및 전체화면 상태 감지 제어
     ========================================================== */
  const video = document.getElementById('intro-video');
  const videoContainer = document.getElementById('videoContainer');
  const fsButton = document.getElementById('fsButton');
  const btnIcon = document.getElementById('btnIcon');
  const btnText = document.getElementById('btnText');

  const ICON_FULLSCREEN = `
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>`;
  
  const ICON_BADGE = `
    <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80; box-shadow:0 0 8px #4ade80;"></span>`;

  // 전체화면 상태 변경 리스너
  function onFullscreenChange() {
    const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    
    if (isFullscreen) {
      // 전체화면일 때: 지정하신 문구로 변경
      btnIcon.innerHTML = ICON_BADGE;
      btnText.textContent = 'AI 멀티모달 에이전트 기반 음악동영상 자동화 시스템 개발';
    } else {
      // 일반 화면일 때: 기존 전체화면 버튼으로 복귀
      btnIcon.innerHTML = ICON_FULLSCREEN;
      btnText.textContent = '전체화면 (F)';
    }
  }

  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  // 우측 상단 버튼 클릭 핸들러
  function handleBtnClick() {
    const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFullscreen) {
      toggleFullScreen();
    }
  }

  // 전체화면 토글
  function toggleFullScreen() {
    const target = videoContainer;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (target.requestFullscreen) {
        target.requestFullscreen();
      } else if (target.webkitRequestFullscreen) {
        target.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  // 발표 시작 버튼 (전체화면 전환 + 처음부터 재생)
  function startIntroPresentation() {
    toggleFullScreen();
    video.currentTime = 0;
    video.play().catch(e => console.log('Auto-play blocked:', e));
  }

  // 키보드 단축키
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.code === 'Space') {
      e.preventDefault();
      video.paused ? video.play() : video.pause();
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      toggleFullScreen();
    } else if (e.key === 'm' || e.key === 'M') {
      video.muted = !video.muted;
    }
  });
</script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
