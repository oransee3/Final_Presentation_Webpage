<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Domus Music Studio — Final Presentation</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <style>
    /* 메인페이지 16:9 인터페이스 쇼케이스 스테이지 스타일 */
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* 뷰포트 쇼케이스 스테이지 */
    .presentation-stage {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 2.8vh, 32px) 16px clamp(50px, 7vh, 76px);
      margin: 0;
      box-sizing: border-box;
    }

    /* 미래지향적 프레젠테이션 히어로 타이틀 헤더 (상단 배치 및 부제목 공간 확보) */
    .presentation-hero-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 0;
      margin-bottom: clamp(34px, 5.5vh, 60px); /* 차후 들어올 부제목을 위한 여유 공간 확보 */
      z-index: 2;
      user-select: none;
      max-width: min(94vw, 1300px);
      animation: fadeInHeader 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInHeader {
      from {
        opacity: 0;
        transform: translateY(-14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 사이버네틱 펄스 배지 */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 14px;
      margin-bottom: 12px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.18), inset 0 0 10px rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .badge-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 8px #22d3ee;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px #22d3ee; }
      50% { opacity: 0.45; transform: scale(0.85); box-shadow: 0 0 2px #22d3ee; }
    }

    .badge-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7dd3fc;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    /* 네온 사이버 그라디언트 메인 타이틀 (2줄 강제 및 완벽한 중앙 정렬) */
    .hero-main-title {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      font-size: clamp(1.35rem, 2.4vw, 2.25rem);
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      margin: 0 auto;
      padding: 0;
      letter-spacing: -0.035em;
      background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 30%, #38bdf8 65%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.42));
      position: relative;
    }

    .title-line {
      display: block;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    /* 미래지향적 네온 오로라 액센트 라인 */
    .title-accent-glow {
      width: clamp(160px, 24vw, 320px);
      height: 2px;
      margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, #22d3ee, #a855f7, transparent);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.65);
    }

    /* 16:9 프리미엄 쇼케이스 프레임 (화면 균형 최적화) */
    .showcase-window-card {
      width: 85%;
      max-width: min(calc((100vw - 24px) * 0.85), calc((100vh - 190px) * 16 / 9 * 0.85));
      max-width: min(calc((100vw - 24px) * 0.85), calc((100dvh - 190px) * 16 / 9 * 0.85));
      max-height: calc((100vh - 190px) * 0.85);
      max-height: calc((100dvh - 190px) * 0.85);
      aspect-ratio: 16 / 9;
      margin: 0 auto; /* 수평/수직 완전한 화면 정중앙 정렬 */
      background: rgba(13, 18, 30, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.38);
      border-radius: 20px;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(56, 189, 248, 0.16),
        inset 0 0 20px rgba(56, 189, 248, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 16:9 미디어 뷰포트 */
    .showcase-media-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
    }

    .showcase-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #030712;
    }

    /* 동영상 컨트롤러 및 진행 상태바 완전 은닉 (순수 동영상 화면 전용) */
    video.showcase-media::-webkit-media-controls {
      display: none !important;
    }
    video.showcase-media::-webkit-media-controls-enclosure {
      display: none !important;
    }

    /* 1. 모바일 세로 모드 (Portrait: 9:16 ~ 9:20 스마트폰) */
    @media (max-width: 860px) and (orientation: portrait) {
      .presentation-stage {
        padding: 0 10px;
      }
      .presentation-hero-header {
        margin-top: 0;
        margin-bottom: clamp(32px, 6.5vh, 60px); /* 모바일 세로 화면에서도 부제목 공간 충분히 확보 */
      }
      .hero-badge {
        padding: 3px 10px;
        margin-bottom: 8px;
      }
      .badge-text {
        font-size: 10px;
      }
      .hero-main-title {
        font-size: clamp(1.18rem, 5vw, 1.5rem);
        line-height: 1.35;
      }
      .title-accent-glow {
        width: 140px;
        margin-top: 8px;
      }
      .showcase-window-card {
        width: 85%;
        max-width: min(calc(96vw * 0.85), calc((100dvh - 200px) * 16 / 9 * 0.85));
        max-height: calc((100dvh - 200px) * 0.85);
        margin: 0 auto;
        border-radius: 14px;
      }
    }

    /* 2. 모바일 가로 모드 (Landscape: 16:9 ~ 20:9 스마트폰) */
    @media (max-height: 540px) and (orientation: landscape) {
      .presentation-stage {
        padding: 0 8px;
      }
      .presentation-hero-header {
        margin-top: 0;
        margin-bottom: 8px;
      }
      .hero-badge {
        display: none; /* 가로 모드 시 세로 공간 절약을 위해 배지 숨김 */
      }
      .hero-main-title {
        font-size: clamp(0.92rem, 2.4vw, 1.15rem);
        line-height: 1.2;
      }
      .title-accent-glow {
        display: none;
      }
      .showcase-window-card {
        width: 85%;
        max-width: min(calc((100vw - 20px) * 0.85), calc((100dvh - 76px) * 16 / 9 * 0.85));
        max-height: calc((100dvh - 76px) * 0.85);
        margin: 0 auto; /* 가로 화면 완전 정중앙 정렬 */
        border-radius: 12px;
      }
      /* 모바일 가로 모드 시 하단 6개 버튼 독을 슬림 모드로 전환하여 화면 가림 방지 */
      .fp-mobile-dock {
        bottom: 5px !important;
        padding: 3px 8px !important;
        gap: 4px !important;
      }
      .fp-dock-btn {
        height: 28px !important;
        min-width: 28px !important;
        padding: 0 7px !important;
        font-size: 11px !important;
      }
      .fp-dock-divider {
        height: 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- 실시간 스타필드 파티클 캔버스 & 사이버네틱 그리드 배경 오버레이 -->
  <canvas id="hubBgCanvas"></canvas>
  <div class="cyber-grid-overlay"></div>

  <!-- 키보드 단축키 이동 토스트 알림 -->
  <div id="shortcutToast" class="shortcut-toast" role="status" aria-live="polite"></div>

  <!-- 중앙 16:9 인터페이스 쇼케이스 스테이지 -->
  <main class="presentation-stage" id="presentationStage">
    
    <!-- 미래지향적 프레젠테이션 히어로 타이틀 헤더 -->
    <header class="presentation-hero-header">
      <div class="hero-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">FINAL PRESENTATION · AI MULTIMODAL SYSTEM</span>
      </div>
      <h1 class="hero-main-title">
        <span class="title-line">AI 멀티모달 에이전트 기반</span>
        <span class="title-line">음악동영상 생성 자동화 시스템 개발</span>
      </h1>
      <div class="title-accent-glow"></div>
    </header>

    <div class="showcase-window-card">

      <!-- 16:9 인터페이스 동영상 컨테이너 (무한 반복 자동 재생 & 컨트롤 바 없는 순수 화면) -->
      <div class="showcase-media-wrap">
        <video 
          id="mainShowcaseVideo" 
          class="showcase-media" 
          autoplay 
          muted 
          loop 
          playsinline 
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
          poster="./MainpageImage/back.png"
        >
          <source src="./MainpageImage/mainMove01.webm" type="video/webm">
          <!-- 비디오 미지원 환경 폴백 이미지 -->
          <img 
            src="./MainpageImage/back.png" 
            alt="AI Domus Music Studio 시스템 통합 인터페이스 쇼케이스" 
            class="showcase-media" 
          />
        </video>
      </div>

    </div>
  </main>

  <!-- 동영상 무한 반복 자동 재생 보장 스크립트 -->
  <script>
    (function initShowcaseVideo() {
      const video = document.getElementById('mainShowcaseVideo');
      if (video) {
        video.muted = true;
        const startPlay = function() {
          const promise = video.play();
          if (promise !== undefined) {
            promise.catch(function(err) {
              console.log('Video autoplay deferred:', err);
            });
          }
        };

        if (video.readyState >= 2) {
          startPlay();
        } else {
          video.addEventListener('loadedmetadata', startPlay, { once: true });
          video.addEventListener('canplay', startPlay, { once: true });
        }

        // 반복 재생 보장
        video.addEventListener('ended', function() {
          video.currentTime = 0;
          video.play().catch(function() {});
        });

        // 모바일 브라우저 최초 제스처 시 재생 정책 해제 보장
        const unlockPlay = function() {
          if (video.paused) {
            video.play().catch(function() {});
          }
          document.removeEventListener('touchstart', unlockPlay);
          document.removeEventListener('click', unlockPlay);
        };
        document.addEventListener('touchstart', unlockPlay, { passive: true });
        document.addEventListener('click', unlockPlay);
      }
    })();
  </script>

  <!-- 글로벌 네비게이션 & 하단 6개 컨트롤러 독 스크립트 -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
