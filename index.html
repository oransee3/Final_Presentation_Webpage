<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Domus Music Studio — Final Presentation</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <style>
    /* 메인페이지 16:9 인터페이스 쇼케이스 스테이지 스타일 */
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* 뷰포트 중앙 16:9 쇼케이스 정렬 */
    .presentation-stage {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 84px; /* 하단 6개 버튼 독과의 간격 확보 */
      box-sizing: border-box;
    }

    /* KAPWING 스타일의 16:9 프리미엄 윈도우 프레임 */
    .showcase-window-card {
      width: 100%;
      max-width: min(calc(100vw - 24px), calc((100vh - 110px) * 16 / 9));
      max-width: min(calc(100vw - 24px), calc((100dvh - 110px) * 16 / 9));
      max-height: calc(100vh - 110px);
      max-height: calc(100dvh - 110px);
      aspect-ratio: 16 / 9;
      background: rgba(13, 18, 30, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.38);
      border-radius: 20px;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(56, 189, 248, 0.16),
        inset 0 0 20px rgba(56, 189, 248, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 16:9 미디어 뷰포트 */
    .showcase-media-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
    }

    .showcase-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #030712;
    }

    /* 동영상 컨트롤러 및 진행 상태바 완전 은닉 (순수 동영상 화면 전용) */
    video.showcase-media::-webkit-media-controls {
      display: none !important;
    }
    video.showcase-media::-webkit-media-controls-enclosure {
      display: none !important;
    }

    /* 1. 모바일 세로 모드 (Portrait: 9:16 ~ 9:20 스마트폰) */
    @media (max-width: 860px) and (orientation: portrait) {
      .presentation-stage {
        padding: 12px 10px 80px;
      }
      .showcase-window-card {
        width: 100%;
        max-width: min(96vw, calc((100dvh - 90px) * 16 / 9));
        max-height: calc(100dvh - 90px);
        border-radius: 14px;
      }
    }

    /* 2. 모바일 가로 모드 (Landscape: 16:9 ~ 20:9 스마트폰) 특화 반응형 */
    @media (max-height: 540px) and (orientation: landscape) {
      .presentation-stage {
        padding: 6px 12px 46px; /* 하단 콤팩트 독 높이에 맞춘 최소 여백 */
      }
      .showcase-window-card {
        width: 100%;
        max-width: min(calc(100vw - 20px), calc((100dvh - 52px) * 16 / 9));
        max-height: calc(100dvh - 52px);
        border-radius: 12px;
      }
      /* 모바일 가로 모드 시 하단 6개 버튼 독을 슬림 모드로 전환하여 화면 가림 방지 */
      .fp-mobile-dock {
        bottom: 5px !important;
        padding: 3px 8px !important;
        gap: 4px !important;
      }
      .fp-dock-btn {
        height: 28px !important;
        min-width: 28px !important;
        padding: 0 7px !important;
        font-size: 11px !important;
      }
      .fp-dock-divider {
        height: 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- 실시간 스타필드 파티클 캔버스 & 사이버네틱 그리드 배경 오버레이 -->
  <canvas id="hubBgCanvas"></canvas>
  <div class="cyber-grid-overlay"></div>

  <!-- 키보드 단축키 이동 토스트 알림 -->
  <div id="shortcutToast" class="shortcut-toast" role="status" aria-live="polite"></div>

  <!-- 중앙 16:9 인터페이스 쇼케이스 스테이지 -->
  <main class="presentation-stage" id="presentationStage">
    <div class="showcase-window-card">

      <!-- 16:9 인터페이스 동영상 컨테이너 (무한 반복 자동 재생 & 컨트롤 바 없는 순수 화면) -->
      <div class="showcase-media-wrap">
        <video 
          id="mainShowcaseVideo" 
          class="showcase-media" 
          autoplay 
          muted 
          loop 
          playsinline 
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
          poster="./MainpageImage/back.png"
        >
          <source src="./MainpageImage/mainMove01.webm" type="video/webm">
          <!-- 비디오 미지원 환경 폴백 이미지 -->
          <img 
            src="./MainpageImage/back.png" 
            alt="AI Domus Music Studio 시스템 통합 인터페이스 쇼케이스" 
            class="showcase-media" 
          />
        </video>
      </div>

    </div>
  </main>

  <!-- 동영상 무한 반복 자동 재생 보장 스크립트 -->
  <script>
    (function initShowcaseVideo() {
      const video = document.getElementById('mainShowcaseVideo');
      if (video) {
        video.muted = true;
        const startPlay = function() {
          const promise = video.play();
          if (promise !== undefined) {
            promise.catch(function(err) {
              console.log('Video autoplay deferred:', err);
            });
          }
        };

        if (video.readyState >= 2) {
          startPlay();
        } else {
          video.addEventListener('loadedmetadata', startPlay, { once: true });
          video.addEventListener('canplay', startPlay, { once: true });
        }

        // 반복 재생 보장
        video.addEventListener('ended', function() {
          video.currentTime = 0;
          video.play().catch(function() {});
        });

        // 모바일 브라우저 최초 제스처 시 재생 정책 해제 보장
        const unlockPlay = function() {
          if (video.paused) {
            video.play().catch(function() {});
          }
          document.removeEventListener('touchstart', unlockPlay);
          document.removeEventListener('click', unlockPlay);
        };
        document.addEventListener('touchstart', unlockPlay, { passive: true });
        document.addEventListener('click', unlockPlay);
      }
    })();
  </script>

  <!-- 글로벌 네비게이션 & 하단 6개 컨트롤러 독 스크립트 -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
