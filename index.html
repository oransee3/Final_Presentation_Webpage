<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Domus Music Studio — Final Presentation</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <style>
    /* 프로젝트 발표용 메인페이지 클린 스테이지 스타일 */
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 발표용 새 디자인을 구성할 수 있는 메인 스테이지 캔버스 영역 */
    .presentation-stage {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 80px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- 실시간 스타필드 파티클 캔버스 & 사이버네틱 그리드 배경 오버레이 -->
  <canvas id="hubBgCanvas"></canvas>
  <div class="cyber-grid-overlay"></div>

  <!-- 키보드 단축키 이동 토스트 알림 -->
  <div id="shortcutToast" class="shortcut-toast" role="status" aria-live="polite"></div>

  <!-- 프로젝트 발표용 메인페이지 새 디자인 컨테이너 영역 -->
  <main class="presentation-stage" id="presentationStage">
    <!-- 새 디자인이 배치될 영역 -->
  </main>

  <!-- 글로벌 네비게이션 & 하단 6개 컨트롤러 독 스크립트 -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
