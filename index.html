<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Domus Music Studio — Final Presentation</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <style>
    /* 메인페이지 16:9 인터페이스 쇼케이스 스테이지 스타일 */
    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto; /* 발표용 PC/빔프로젝터 대화면 상·하 스크롤바로 위·아래 자유 이동 */
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      scroll-behavior: smooth;
    }

    /* 사이버네틱 프리미엄 슬림 스크롤바 디자인 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(3, 7, 18, 0.95);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.45), rgba(168, 85, 247, 0.45));
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.8), rgba(168, 85, 247, 0.8));
    }

    /* 메인페이지 뷰포트 쇼케이스 스테이지: 발표용 데스크톱/빔프로젝터 4단 수직 전용 배치 */
    .presentation-stage {
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 45px 24px 140px; /* 상단 여백 및 하단 6개 고정 독 버튼과의 넉넉한 안전 여백 */
      margin: 0;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* 미래지향적 프레젠테이션 히어로 타이틀 헤더 */
    .presentation-hero-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
      z-index: 2;
      user-select: none;
      max-width: min(94vw, 1300px);
      animation: fadeInHeader 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 1. 제목과 동영상 사이: 부제목 전용 공간 및 중앙 배열 스타일 */
    .presentation-subtitle-zone {
      width: 100%;
      max-width: min(94vw, 1300px);
      min-height: 140px;
      margin: 15px 0 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
      box-sizing: border-box;
      pointer-events: none;
    }

    /* 부제목 컨텐츠 래퍼 (중앙 배열 및 사이간격 축소) */
    .subtitle-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px; /* 부제목 윗줄과 아랫줄 사이 간격을 긴밀하게 좁힘 */
      width: 100%;
      margin: 0 auto;
    }

    .subtitle-line {
      margin: 0;
      padding: 0;
      width: 100%;
      line-height: 1.3;
      text-align: center;
      transform-origin: center center;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      will-change: opacity, transform, filter;
    }

    /* 첫 번째 윗줄: 200%에서 100%로 1.5초 줌인 & 페이드 인 (총 10초 주기, 5초 유지) */
    .subtitle-line-1 {
      font-size: clamp(1.15rem, 1.7vw, 1.55rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #a5f3fc;
      text-shadow: 0 0 16px rgba(34, 211, 238, 0.45);
      animation: subtitleZoomInLine1 10s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* 두 번째 아랫줄: 200%에서 100%로 1.0초 줌인 & 페이드 인 (총 10초 주기, 5초 유지) */
    .subtitle-line-2 {
      font-size: clamp(1.4rem, 2.2vw, 2.05rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 45%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
      animation: subtitleZoomInLine2 10s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* 중간점(·) 스타일 (글자 아래 불릿 점 충돌 완전 제거 및 순수 가운뎃점 네온 스타일) */
    .subtitle-mid-dot {
      display: inline-block;
      margin: 0 10px;
      width: auto !important;
      height: auto !important;
      background: none !important;
      border-radius: 0 !important;
      -webkit-text-fill-color: initial;
      color: #22d3ee;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.9);
      vertical-align: middle;
      line-height: 1;
    }

    .sub-paren {
      font-size: 0.88em;
      font-weight: 700;
      opacity: 0.9;
    }

    /* 부제목 첫 번째 줄: 큰 상태(200%)에서 원래상태(100%)로 1.5초 줌인 페이드인 -> 7.5s까지(5초) 유지 -> 9.0s까지(1.5초) 동시 페이드아웃 */
    @keyframes subtitleZoomInLine1 {
      0% {
        opacity: 0;
        transform: scale(2.0);
        filter: blur(5px);
      }
      15% { /* 1.5s / 10.0s: 200% -> 100% 줌인 완료 */
        opacity: 1;
        transform: scale(1.0);
        filter: blur(0px);
      }
      75% { /* 7.5s / 10.0s: 100% 상태에서 5.0초간 유지 */
        opacity: 1;
        transform: scale(1.0);
        filter: blur(0px);
      }
      90% { /* 9.0s / 10.0s: 1.5초 동안 동시 페이드 아웃 */
        opacity: 0;
        transform: scale(0.96);
        filter: blur(2px);
      }
      100% {
        opacity: 0;
        transform: scale(0.96);
        filter: blur(2px);
      }
    }

    /* 부제목 두 번째 줄: 1.5s 대기 -> 큰 상태(200%)에서 원래상태(100%)로 1.0초 줌인 페이드인 -> 7.5s까지(5초) 유지 -> 9.0s까지(1.5초) 동시 페이드아웃 */
    @keyframes subtitleZoomInLine2 {
      0%, 15% { /* 0s ~ 1.5s: 첫 번째 줄 완료까지 대기 */
        opacity: 0;
        transform: scale(2.0);
        filter: blur(5px);
      }
      25% { /* 2.5s / 10.0s: 1.5s~2.5s(1.0초간) 200% -> 100% 줌인 완료 */
        opacity: 1;
        transform: scale(1.0);
        filter: blur(0px);
      }
      75% { /* 7.5s / 10.0s: 100% 상태에서 5.0초간 유지 */
        opacity: 1;
        transform: scale(1.0);
        filter: blur(0px);
      }
      90% { /* 9.0s / 10.0s: 1.5초 동안 동시 페이드 아웃 */
        opacity: 0;
        transform: scale(0.96);
        filter: blur(2px);
      }
      100% {
        opacity: 0;
        transform: scale(0.96);
        filter: blur(2px);
      }
    }

    /* 2. 동영상과 하단 6개 버튼 독 사이: 팀명과 멘토명이 들어갈 전용 공간 영역 */
    .presentation-meta-zone {
      width: 100%;
      max-width: min(94vw, 1300px);
      min-height: 80px;
      margin: 40px 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-sizing: border-box;
      pointer-events: none;
    }

    @keyframes fadeInHeader {
      from {
        opacity: 0;
        transform: translateY(-14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 사이버네틱 펄스 배지 */
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 14px;
      margin-bottom: 12px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.18), inset 0 0 10px rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .badge-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 8px #22d3ee;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px #22d3ee; }
      50% { opacity: 0.45; transform: scale(0.85); box-shadow: 0 0 2px #22d3ee; }
    }

    .badge-text {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7dd3fc;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    /* 네온 사이버 그라디언트 메인 타이틀 (2줄 강제 및 완벽한 중앙 정렬) */
    .hero-main-title {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      font-size: clamp(1.35rem, 2.4vw, 2.25rem);
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      margin: 0 auto;
      padding: 0;
      letter-spacing: -0.035em;
      background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 30%, #38bdf8 65%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.42));
      position: relative;
    }

    .title-line {
      display: block;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    /* 미래지향적 네온 오로라 액센트 라인 */
    .title-accent-glow {
      width: clamp(160px, 24vw, 320px);
      height: 2px;
      margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, #22d3ee, #a855f7, transparent);
      border-radius: 999px;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.65);
    }

    /* 16:9 프리미엄 쇼케이스 프레임 (데스크톱 16:9 비율 유지 75% 스케일) */
    .showcase-window-card {
      width: 75%;
      max-width: 1350px;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      margin: 0 auto;
      background: rgba(13, 18, 30, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.38);
      border-radius: 20px;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(56, 189, 248, 0.16),
        inset 0 0 20px rgba(56, 189, 248, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 16:9 미디어 뷰포트 */
    .showcase-media-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      position: relative;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
    }

    .showcase-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #030712;
    }

    /* 동영상 컨트롤러 및 진행 상태바 완전 은닉 (순수 동영상 화면 전용) */
    video.showcase-media::-webkit-media-controls {
      display: none !important;
    }
    video.showcase-media::-webkit-media-controls-enclosure {
      display: none !important;
    }

    /* 1. 모바일 세로 모드 (Portrait: 9:16 ~ 9:20 스마트폰) */
    @media (max-width: 860px) and (orientation: portrait) {
      .presentation-stage {
        padding: clamp(16px, 3vh, 32px) 12px clamp(68px, 8.5vh, 88px);
      }
      .presentation-hero-header {
        margin-top: 0;
        margin-bottom: 0;
      }
      .hero-badge {
        padding: 3px 10px;
        margin-bottom: 8px;
      }
      .badge-text {
        font-size: 10px;
      }
      .hero-main-title {
        font-size: clamp(1.18rem, 5vw, 1.5rem);
        line-height: 1.35;
      }
      .title-accent-glow {
        width: 140px;
        margin-top: 8px;
      }
      .presentation-subtitle-zone {
        min-height: clamp(38px, 6.5vh, 70px);
      }
      .presentation-meta-zone {
        min-height: clamp(38px, 6.5vh, 70px);
      }
      .showcase-window-card {
        width: 75%;
        max-width: min(calc(96vw * 0.75), calc((100dvh - 270px) * 16 / 9 * 0.75));
        max-height: calc((100dvh - 270px) * 0.75);
        flex-shrink: 0;
        margin: auto auto;
        border-radius: 14px;
      }
    }

    /* 2. 모바일 가로 모드 (Landscape: 16:9 ~ 20:9 스마트폰) */
    @media (max-height: 540px) and (orientation: landscape) {
      .presentation-stage {
        padding: 6px 8px 36px;
      }
      .presentation-hero-header {
        margin-top: 0;
        margin-bottom: 2px;
      }
      .hero-badge {
        display: none; /* 가로 모드 시 세로 공간 절약을 위해 배지 숨김 */
      }
      .hero-main-title {
        font-size: clamp(0.92rem, 2.4vw, 1.15rem);
        line-height: 1.2;
      }
      .title-accent-glow {
        display: none;
      }
      .presentation-subtitle-zone {
        min-height: 18px;
      }
      .presentation-meta-zone {
        min-height: 18px;
      }
      .showcase-window-card {
        width: 75%;
        max-width: min(calc((100vw - 20px) * 0.75), calc((100dvh - 84px) * 16 / 9 * 0.75));
        max-height: calc((100dvh - 84px) * 0.75);
        flex-shrink: 0;
        margin: auto auto;
        border-radius: 12px;
      }
      /* 모바일 가로 모드 시 하단 6개 버튼 독을 슬림 모드로 전환하여 화면 가림 방지 */
      .fp-mobile-dock {
        bottom: 5px !important;
        padding: 3px 8px !important;
        gap: 4px !important;
      }
      .fp-dock-btn {
        height: 28px !important;
        min-width: 28px !important;
        padding: 0 7px !important;
        font-size: 11px !important;
      }
      .fp-dock-divider {
        height: 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- 실시간 스타필드 파티클 캔버스 & 사이버네틱 그리드 배경 오버레이 -->
  <canvas id="hubBgCanvas"></canvas>
  <div class="cyber-grid-overlay"></div>

  <!-- 키보드 단축키 이동 토스트 알림 -->
  <div id="shortcutToast" class="shortcut-toast" role="status" aria-live="polite"></div>

  <!-- 중앙 16:9 인터페이스 쇼케이스 스테이지 -->
  <main class="presentation-stage" id="presentationStage">
    
    <!-- 미래지향적 프레젠테이션 히어로 타이틀 헤더 -->
    <header class="presentation-hero-header">
      <div class="hero-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">FINAL PRESENTATION · AI MULTIMODAL SYSTEM</span>
      </div>
      <h1 class="hero-main-title">
        <span class="title-line">AI 멀티모달 에이전트 기반</span>
        <span class="title-line">음악동영상 생성 자동화 시스템 개발</span>
      </h1>
      <div class="title-accent-glow"></div>
    </header>

    <!-- 1. 제목과 동영상 사이: 부제목을 넣을 전용 공간 영역 -->
    <div class="presentation-subtitle-zone" id="presentationSubtitleZone">
      <div class="subtitle-content">
        <p class="subtitle-line subtitle-line-1">단 몇 줄의 프롬프트로</p>
        <p class="subtitle-line subtitle-line-2">
          음원<span class="sub-paren">(mp3)</span><span class="subtitle-mid-dot">·</span>음악동영상<span class="subtitle-mid-dot">·</span>유튜브 업로드까지
        </p>
      </div>
    </div>

    <div class="showcase-window-card">

      <!-- 16:9 인터페이스 동영상 컨테이너 (무한 반복 자동 재생 & 컨트롤 바 없는 순수 화면) -->
      <div class="showcase-media-wrap">
        <video 
          id="mainShowcaseVideo" 
          class="showcase-media" 
          autoplay 
          muted 
          loop 
          playsinline 
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
          poster="./MainpageImage/back.png"
        >
          <source src="./MainpageImage/mainMove01.webm" type="video/webm">
          <!-- 비디오 미지원 환경 폴백 이미지 -->
          <img 
            src="./MainpageImage/back.png" 
            alt="AI Domus Music Studio 시스템 통합 인터페이스 쇼케이스" 
            class="showcase-media" 
          />
        </video>
      </div>

    </div>

    <!-- 2. 동영상과 하단 6개 버튼 독 사이: 팀명과 멘토명이 들어갈 전용 공간 영역 -->
    <div class="presentation-meta-zone" id="presentationMetaZone">
      <!-- 향후 팀명 및 멘토명 배치 영역 -->
    </div>
  </main>

  <!-- 동영상 무한 반복 자동 재생 보장 스크립트 -->
  <script>
    (function initShowcaseVideo() {
      const video = document.getElementById('mainShowcaseVideo');
      if (video) {
        video.muted = true;
        const startPlay = function() {
          const promise = video.play();
          if (promise !== undefined) {
            promise.catch(function(err) {
              console.log('Video autoplay deferred:', err);
            });
          }
        };

        if (video.readyState >= 2) {
          startPlay();
        } else {
          video.addEventListener('loadedmetadata', startPlay, { once: true });
          video.addEventListener('canplay', startPlay, { once: true });
        }

        // 반복 재생 보장
        video.addEventListener('ended', function() {
          video.currentTime = 0;
          video.play().catch(function() {});
        });

        // 모바일 브라우저 최초 제스처 시 재생 정책 해제 보장
        const unlockPlay = function() {
          if (video.paused) {
            video.play().catch(function() {});
          }
          document.removeEventListener('touchstart', unlockPlay);
          document.removeEventListener('click', unlockPlay);
        };
        document.addEventListener('touchstart', unlockPlay, { passive: true });
        document.addEventListener('click', unlockPlay);
      }
    })();
  </script>

  <!-- 글로벌 네비게이션 & 하단 6개 컨트롤러 독 스크립트 -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
