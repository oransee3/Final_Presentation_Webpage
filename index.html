<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Domus Music Studio — Final Presentation</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <style>
    /* 메인페이지 16:9 인터페이스 쇼케이스 스테이지 스타일 */
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f1f5f9;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* 뷰포트 중앙 16:9 쇼케이스 정렬 */
    .presentation-stage {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 84px; /* 하단 6개 버튼 독과의 간격 확보 */
      box-sizing: border-box;
    }

    /* KAPWING 스타일의 16:9 프리미엄 윈도우 프레임 */
    .showcase-window-card {
      width: 100%;
      max-width: min(calc(100vw - 24px), calc((100vh - 110px) * 16 / 9));
      max-width: min(calc(100vw - 24px), calc((100dvh - 110px) * 16 / 9));
      max-height: calc(100vh - 110px);
      max-height: calc(100dvh - 110px);
      aspect-ratio: 16 / 9;
      background: rgba(13, 18, 30, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.38);
      border-radius: 20px;
      box-shadow: 
        0 24px 70px rgba(0, 0, 0, 0.85),
        0 0 45px rgba(56, 189, 248, 0.16),
        inset 0 0 20px rgba(56, 189, 248, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 윈도우 상단 컨트롤 바 */
    .window-header {
      height: 36px;
      background: rgba(18, 26, 44, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      user-select: none;
    }

    .window-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .window-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .window-dot.close { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
    .window-dot.min { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.5); }
    .window-dot.max { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }

    .window-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }
    .window-title strong {
      color: #38bdf8;
    }

    .window-tag {
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* 16:9 미디어 뷰포트 */
    .showcase-media-wrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .showcase-media {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #030712;
    }

    /* 1. 모바일 세로 모드 (Portrait: 9:16 ~ 9:20 스마트폰) */
    @media (max-width: 860px) and (orientation: portrait) {
      .presentation-stage {
        padding: 12px 10px 80px;
      }
      .showcase-window-card {
        width: 100%;
        max-width: min(96vw, calc((100dvh - 90px) * 16 / 9));
        max-height: calc(100dvh - 90px);
        border-radius: 14px;
      }
      .window-header {
        height: 30px;
        padding: 0 12px;
      }
      .window-title {
        font-size: 11px;
      }
      .window-tag {
        font-size: 10px;
        padding: 1px 6px;
      }
    }

    /* 2. 모바일 가로 모드 (Landscape: 16:9 ~ 20:9 스마트폰) 특화 반응형 */
    @media (max-height: 540px) and (orientation: landscape) {
      .presentation-stage {
        padding: 6px 12px 46px; /* 하단 콤팩트 독 높이에 맞춘 최소 여백 */
      }
      .showcase-window-card {
        width: 100%;
        max-width: min(calc(100vw - 20px), calc((100dvh - 52px) * 16 / 9));
        max-height: calc(100dvh - 52px);
        border-radius: 12px;
      }
      .window-header {
        height: 24px;
        padding: 0 10px;
      }
      .window-title {
        font-size: 10px;
        gap: 6px;
      }
      .window-dot {
        width: 7px;
        height: 7px;
      }
      .window-tag {
        font-size: 9px;
        padding: 1px 5px;
      }
      /* 모바일 가로 모드 시 하단 6개 버튼 독을 슬림 모드로 전환하여 화면 가림 방지 */
      .fp-mobile-dock {
        bottom: 5px !important;
        padding: 3px 8px !important;
        gap: 4px !important;
      }
      .fp-dock-btn {
        height: 28px !important;
        min-width: 28px !important;
        padding: 0 7px !important;
        font-size: 11px !important;
      }
      .fp-dock-divider {
        height: 16px !important;
      }
    }
  </style>
</head>
<body>

  <!-- 실시간 스타필드 파티클 캔버스 & 사이버네틱 그리드 배경 오버레이 -->
  <canvas id="hubBgCanvas"></canvas>
  <div class="cyber-grid-overlay"></div>

  <!-- 키보드 단축키 이동 토스트 알림 -->
  <div id="shortcutToast" class="shortcut-toast" role="status" aria-live="polite"></div>

  <!-- 중앙 16:9 인터페이스 쇼케이스 스테이지 -->
  <main class="presentation-stage" id="presentationStage">
    <div class="showcase-window-card">
      
      <!-- 상단 윈도우 헤더 바 (KAPWING 스타일) -->
      <div class="window-header">
        <div class="window-dots">
          <span class="window-dot close"></span>
          <span class="window-dot min"></span>
          <span class="window-dot max"></span>
        </div>
        <div class="window-title">
          <span>AI Domus Music Studio</span>
          <span style="opacity:0.4;">|</span>
          <strong>시스템 통합 인터페이스</strong>
        </div>
        <div class="window-tag">16:9 HD Showcase</div>
      </div>

      <!-- 16:9 인터페이스 미디어 컨테이너 (동영상 및 고화질 스크린샷 완벽 지원) -->
      <div class="showcase-media-wrap">
        <!-- 동영상 파일이 지정되었거나 존재할 경우 자동 재생 -->
        <video 
          id="mainShowcaseVideo" 
          class="showcase-media" 
          autoplay 
          muted 
          loop 
          playsinline 
          controls 
          preload="auto"
          style="display: none;"
        >
          <source src="./assets/main_showcase_video.webm" type="video/webm">
          <source src="./assets/main_showcase_video.mp4" type="video/mp4">
        </video>

        <!-- 고화질 원본 인터페이스 이미지 (동영상 미로드 시 기본 표시) -->
        <img 
          id="mainShowcaseImg" 
          class="showcase-media" 
          src="./assets/main_showcase_ui.png" 
          alt="AI Domus Music Studio 시스템 통합 인터페이스 쇼케이스" 
        />
      </div>

    </div>
  </main>

  <!-- 동영상 파일 자동 감지 및 스마트 미디어 스위처 -->
  <script>
    (function checkShowcaseVideo() {
      const video = document.getElementById('mainShowcaseVideo');
      const img = document.getElementById('mainShowcaseImg');
      if (video && img) {
        video.addEventListener('loadeddata', () => {
          img.style.display = 'none';
          video.style.display = 'block';
          video.play().catch(() => {});
        });
        video.addEventListener('error', () => {
          video.style.display = 'none';
          img.style.display = 'block';
        });
      }
    })();
  </script>

  <!-- 글로벌 네비게이션 & 하단 6개 컨트롤러 독 스크립트 -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
